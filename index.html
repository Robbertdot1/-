<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Naat Player</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    height:100vh;
    background:url('bg.png') no-repeat center/cover;
    color:white;
    
}
/* 📱 MOBILE BACKGROUND */
@media(max-width:768px){
  body{
    height:100vh;
    background:url('bg-mobile.png') no-repeat center/cover;
    color:white;
    
}}

/* 🔝 HEADER (NO BACKGROUND) */
.header{
    position:fixed;
    top:0;
font: 1em sans-serif;
    width:100%;
    font-weight: 400;
    padding:15px 20px;
    display:flex;
    color: black;
    justify-content:space-between;
    align-items:center;
    background:transparent; /* 🔥 removed bg */
    
}

/* LEFT */
.left{
    font-size:18px;
}

/* CENTER */
.center{
    display:flex;
    align-items:center;
    gap:8px;
}

.dot{
    width:10px;
    height:10px;
    background:#00ff66;
    border-radius:50%;
    box-shadow:0 0 10px #00ff66,0 0 20px #00ff66;
}

/* RIGHT */
.right a{
    margin-left:15px;
    color:white;
    text-decoration:none;
    opacity:0.8;
}

/* 🎵 SPOTIFY STYLE PLAYER */
.player{
    position:absolute;
    bottom:20px;
    left:50%;
    transform:translateX(-50%);
    width:90%;
    max-width:750px;

    display:flex;
    align-items:center;
    gap:15px;

    padding:15px 20px;
    border-radius:60px;

    background:rgba(255,255,255,0.1); /* glass */
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,0.2);
}

/* COVER */
.cover{
    width:70px;
    height:70px;
    border-radius:50%;
}

/* INFO */
.info{
    flex:1;
}

.info h3{
    font-size:18px;
}

.info p{
    font-size:13px;
    opacity:0.7;
}

/* PROGRESS */
#progress{
    width:100%;
    margin:5px 0;
}

/* TIME */
.time{
    display:flex;
    justify-content:space-between;
    font-size:12px;
}

/* CONTROLS */
.controls{
    display:flex;
    align-items:center;
    gap:10px;
}

.controls button{
    border:none;
    background:none;
    color:white;
    font-size:18px;
    cursor:pointer;
}

/* PLAY BUTTON */
.play{
    width:55px;
    height:55px;
    border-radius:50%;
    background:white;
    color:black;
    font-size:20px;
}

/* MOBILE */
@media(max-width:600px){
    .right{display:none;}
}
</style>
</head>

<body>
<!-- HEADER -->
<div class="header">
    <div class="left" id="time"></div>

    <div class="center">
        <div class="dot"></div>
        <span id="users">32 online</span>
    </div>

 <div class="RIGHT" id="islamicDate">Islamic Date</div>
    
</div>


<!-- PLAYER -->
<div class="player">
    <img src="NAAT 1.jpg" class="cover" id="thumbnail">

    <div class="info">
        <h3 id="title">Tajdar-e-Haram</h3>
        <p id="artist">Atif Aslam</p>

        <input type="range" id="progress">

        <div class="time">
            <span id="current">0:00</span>
            <span id="duration">0:00</span>
        </div>
    </div>


    <div class="controls">
        <button onclick="prevNaat()">⏮</button>
        <button class="play" onclick="togglePlay()">▶</button>
        <button onclick="nextNaat()">⏭</button>
    </div>

    <audio id="audio"></audio>
</div>

<script>
// TIME
function updateTime(){
    let now=new Date();
    document.getElementById("time").innerText=
    now.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
}
setInterval(updateTime,1000);
updateTime();
// ================= ISLAMIC DATE =================
function updateIslamicDate() {
    const date = new Date();
    const islamic = new Intl.DateTimeFormat('en-TN-u-ca-islamic', {
        day: 'numeric',
        month: 'long',
        year: 'numeric'
    }).format(date);

    document.getElementById("islamicDate").innerText = islamic;
}
updateIslamicDate();
// USERS
function users(){
    let num=Math.floor(Math.random()*1000)+10;
    document.getElementById("users").innerText=
    num>999?"999+ online":num+" online";
}
setInterval(users,4000);
users();

// PLAYER
let naats = [
{
    src: "https://drive.google.com/uc?export=download&id=1MoFC60Mkk4GFmdrH5XaLxHf-C4RUfosS",
    img: "NAAT 1.jpg",
    title: "TAJDAR-E-HARAM",
    artist: "Atif Aslam"
}

{src:"naat2.mp3",img:"naat2.jpg",title:"FASLON KO TAKALLUF",artist:"Qari Waheed Zafar Kazmi"}
];

let index=0;
let audio=document.getElementById("audio");
let progress=document.getElementById("progress");

function load(){
    audio.src=naats[index].src;
    thumbnail.src=naats[index].img;
    title.innerText=naats[index].title;
    artist.innerText=naats[index].artist;
}
load();

function togglePlay(){
    if(audio.paused){
        audio.play();
        document.querySelector(".play").innerText="⏸";
    }else{
        audio.pause();
        document.querySelector(".play").innerText="▶";
    }
}

function nextNaat(){
    index=(index+1)%naats.length;
    load(); audio.play();
}

function prevNaat(){
    index=(index-1+naats.length)%naats.length;
    load(); audio.play();
}

audio.ontimeupdate=()=>{
    progress.value=(audio.currentTime/audio.duration)*100||0;

    current.innerText=format(audio.currentTime);
    duration.innerText=format(audio.duration);
};

progress.oninput=()=>{
    audio.currentTime=(progress.value/100)*audio.duration;
};

function format(sec){
    if(!sec) return "0:00";
    let m=Math.floor(sec/60);
    let s=Math.floor(sec%60);
    return m+":"+(s<10?"0"+s:s);
}
</script>

</body>
</html>
